apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: sophia-git
spec:
  egress:
  - to:
      dnsName: github.com
    type: Allow
  - to:
      dnsName: smtp.gmail.com
    type: Allow
  - to:
      cidrSelector: 172.30.0.0/16 # Autorise la communication avec les autres services OKD
    type: Allow
  - to:
      cidrSelector: ${VPN_NETWORK}   # Retour vers le réseau du VPN (voir okd/host/wireguard/)
    type: Allow
  - to:
      cidrSelector: 0.0.0.0/0     # Bloque tout le reste (Air-Gapped)
    type: Deny
