apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: sophia-git
spec:
  egress:
  - to:
      dnsName: ${FORGE_MIROIR_DNS}   # Copie hors site des dépôts par miroir : une seconde forge, sur un site maîtrisé ou chez un hébergeur de l'UE
    type: Allow
  - to:
      dnsName: ${FORGE_SMTP_DNS}     # Relais SMTP des notifications de la forge
    type: Allow
  - to:
      cidrSelector: 172.30.0.0/16 # Autorise la communication avec les autres services OKD
    type: Allow
  - to:
      cidrSelector: ${VPN_NETWORK}   # Retour vers le réseau du VPN (voir okd/host/wireguard/)
    type: Allow
  - to:
      cidrSelector: 0.0.0.0/0     # Bloque tout le reste (Air-Gapped)
    type: Deny
