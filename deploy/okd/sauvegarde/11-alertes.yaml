# Alertes de la sauvegarde, sur les séries de kube-state-metrics de la plateforme. Une règle par namespace : Thanos
# Ruler ne montre à une règle que les séries de son namespace. Étiquette « sophia: oui » : celle que route la
# supervision (../monitoring/). Cinq alertes par CronJob :
#   - EnEchec : le dernier lancement s'est fini sans succès (ou n'a jamais réussi), aucun Job actif ;
#   - EnRetard : pas de succès depuis le seuil (2 h pour l'horaire, 26 h pour le quotidien, 8 jours pour
#     l'hebdomadaire) ;
#   - JamaisReussie : CronJob actif sans aucun succès depuis le seuil ;
#   - Absente : le CronJob n'existe plus ;
#   - Suspendue (warning) : le CronJob est suspendu depuis une heure.
# Mise en service : les CronJobs sont créés suspendus et lancés d'abord à la main. Retard et « jamais réussie »
# s'éteignent tant que le CronJob est suspendu, et « suspendue » sonne : c'est l'alerte forcée qui prouve la chaîne
# jusqu'à l'administrateur. Les Jobs lancés par « oc create job --from=cronjob/… » portent l'ownerReference du
# CronJob et remplissent lastSuccessfulTime. Aucune variable à rendre.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sophia-sauvegardes
  namespace: sophia-git
  labels:
    sophia: oui
spec:
  groups:
  - name: sophia-sauvegardes-sophia-git
    rules:
    - alert: SophiaSauvegardeEnEchec
      expr: (kube_cronjob_status_last_schedule_time{namespace="sophia-git",cronjob="extraction-forgejo"} > on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="sophia-git",cronjob="extraction-forgejo"} or (kube_cronjob_status_last_schedule_time{namespace="sophia-git",cronjob="extraction-forgejo"} unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="sophia-git",cronjob="extraction-forgejo"})) and on (namespace, cronjob) (kube_cronjob_status_active{namespace="sophia-git",cronjob="extraction-forgejo"} == 0)
      for: 5m
      labels:
        severity: critical
        sophia: oui
      annotations:
        summary: 'Sauvegarde sophia-git/extraction-forgejo : le dernier lancement a échoué'
        action: oc -n sophia-git get jobs, puis le journal du dernier Job (oc -n sophia-git logs job/<nom> --all-containers)
    - alert: SophiaSauvegardeEnRetard
      expr: (time() - kube_cronjob_status_last_successful_time{namespace="sophia-git",cronjob="extraction-forgejo"} > 93600) unless on (namespace, cronjob) (kube_cronjob_spec_suspend{namespace="sophia-git",cronjob="extraction-forgejo"} == 1)
      for: 10m
      labels:
        severity: critical
        sophia: oui
      annotations:
        summary: 'Sauvegarde sophia-git/extraction-forgejo : aucun succès depuis plus de 26 h'
        action: oc -n sophia-git get cronjob extraction-forgejo et les derniers Jobs ; lancer à la main si besoin (oc -n sophia-git create job --from=cronjob/extraction-forgejo <nom>)
    - alert: SophiaSauvegardeJamaisReussie
      expr: (kube_cronjob_spec_suspend{namespace="sophia-git",cronjob="extraction-forgejo"} == 0) unless on (namespace, cronjob) kube_cronjob_status_last_successful_time{namespace="sophia-git",cronjob="extraction-forgejo"}
      for: 93600s
      labels:
        severity: critical
        sophia: oui
      annotations:
        summary: 'Sauvegarde sophia-git/extraction-forgejo : active depuis plus de 26 h sans aucun succès'
        action: oc -n sophia-git get cronjob extraction-forgejo -o yaml (status) et les Jobs du namespace
    - alert: SophiaSauvegardeAbsente
      expr: absent(kube_cronjob_spec_suspend{namespace="sophia-git",cronjob="extraction-forgejo"})
      for: 30m
      labels:
        severity: critical
        sophia: oui
      annotations:
        summary: 'Sauvegarde sophia-git/extraction-forgejo : le CronJob n''existe plus'
        action: réappliquer le gabarit versionné (deploy/okd/sauvegarde)
    - alert: SophiaSauvegardeSuspendue
      expr: kube_cronjob_spec_suspend{namespace="sophia-git",cronjob="extraction-forgejo"} == 1
      for: 1h
      labels:
        severity: warning
        sophia: oui
      annotations:
        summary: 'Sauvegarde sophia-git/extraction-forgejo : CronJob suspendu, aucune sauvegarde automatique'
        action: attendu pendant la mise en service (premiers lancements à la main) ; sinon lever la suspension
---
