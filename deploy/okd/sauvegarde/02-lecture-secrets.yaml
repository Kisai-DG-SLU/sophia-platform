# Lecture des Secrets d'UN namespace par le compte des sauvegardes : un Role et un RoleBinding par namespace,
# jamais de ClusterRole. Le fichier se rend une fois par namespace de la liste SECRETS_NAMESPACES (README.md,
# étape 2), par envsubst avec la seule variable NAMESPACE_LU. Exclu de la liste : sophia-sauvegarde, dont le
# mot de passe restic est gardé hors de la plateforme. Un namespace créé plus tard s'ajoute à la liste, puis ici.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sauvegarde-lecture-secrets
  namespace: ${NAMESPACE_LU}
rules:
- apiGroups: [""]
  resources: [secrets]
  verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sauvegarde-lecture-secrets
  namespace: ${NAMESPACE_LU}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sauvegarde-lecture-secrets
subjects:
- kind: ServiceAccount
  name: sauvegarde
  namespace: sophia-sauvegarde
