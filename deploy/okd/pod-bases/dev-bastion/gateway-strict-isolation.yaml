apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-strict-isolation
  namespace: ${SANDBOX_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: dev-gateway
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 2222
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              type: dev-workspace
      ports:
        - protocol: TCP
          port: 2222
