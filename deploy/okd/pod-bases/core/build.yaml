apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sophia-core-base
  namespace: sophia-core
spec:
  source:
    type: Git
    git:
      uri: ${CONFIG_REPO_URL}      # dépôt Git interne qui contient ce dossier
    sourceSecret:
      name: forgejo-creds
    contextDir: deploy/okd/pod-bases/core/
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  # Le pod de build compte dans le quota de sophia-core : limites explicites, sinon il reçoit les valeurs
  # par défaut du namespace
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  output:
    to:
      kind: ImageStreamTag
      name: sophia-core:base
