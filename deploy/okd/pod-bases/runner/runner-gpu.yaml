# Historique, non maintenu : runner d'intégration continue du socle de juin 2026, à l'arrêt (0 réplique) dans l'installation de référence, retrait en attente (voir README.md de ce dossier).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${RUNNER_NAME:-forgejo-runner-gpu}
  namespace: ${GIT_NAMESPACE}
spec:
  replicas: 1
  # Un seul GPU : l'ancien pod libère le GPU avant le nouveau. null : « oc apply » retire le rollingUpdate que
  # l'API pose par défaut, sans quoi un Recreate avec rollingUpdate serait refusé.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: ${RUNNER_NAME:-forgejo-runner-gpu}
  template:
    metadata:
      labels:
        app: ${RUNNER_NAME:-forgejo-runner-gpu}
    spec:
      serviceAccountName: ${RUNNER_SERVICE_ACCOUNT:-forgejo-runner-sa}
      initContainers:
      - name: extract-runner
        image: gitea/act_runner:latest
        command: ["/bin/sh", "-c", "cp $(which act_runner) /shared/act_runner && chmod +x /shared/act_runner"]
        resources:
          requests: { cpu: 10m, memory: 32Mi }
          limits: { cpu: 200m, memory: 128Mi }
        volumeMounts:
        - name: shared-bin
          mountPath: /shared
      containers:
      - name: runner
        image: ${INTERNAL_REGISTRY}/${SANDBOX_NAMESPACE}/${DEV_IMAGE_NAME:-sophia-dev-base}:latest
        workingDir: /data-runner
        command:
        - /bin/bash
        - -c
        - |
          set -e
          rm -f .runner
          /shared/act_runner register \
            --instance "$GITEA_INSTANCE_URL" \
            --token "$GITEA_RUNNER_REGISTRATION_TOKEN" \
            --name "$GITEA_RUNNER_NAME" \
            --labels "$GITEA_RUNNER_LABELS" \
            --no-interactive \
            --config /config/config.yaml
          exec /shared/act_runner daemon --config /config/config.yaml
        env:
        - name: GITEA_INSTANCE_URL
          value: ${FORGEJO_SERVICE:-http://forgejo-svc:3000}
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${RUNNER_SECRET_NAME}
              key: ${RUNNER_TOKEN_KEY:-registration_token}
        - name: GITEA_RUNNER_NAME
          value: ${RUNNER_NAME:-forgejo-runner-gpu}
        - name: GITEA_RUNNER_LABELS
          value: ${RUNNER_LABELS:-gpu:host,linux:host,pixi:host,exec:host}
        # Ressources explicites : sous le LimitRange de son namespace, un conteneur sans limite de CPU ni de mémoire
        # recevrait les valeurs par défaut (500m, 512 Mio), trop petites pour une CI GPU.
        resources:
          requests: { cpu: 500m, memory: 1Gi }
          limits:
            cpu: "4"
            memory: 8Gi
            nvidia.com/gpu: ${GPU_COUNT:-1}
        volumeMounts:
        - name: shared-bin
          mountPath: /shared
        - name: runner-data
          mountPath: /data-runner
        - name: config-volume
          mountPath: /config
      volumes:
      - name: shared-bin
        emptyDir: {}
      - name: runner-data
        emptyDir: {}
      - name: config-volume
        configMap:
          name: ${RUNNER_CONFIG_MAP:-runner-config}
