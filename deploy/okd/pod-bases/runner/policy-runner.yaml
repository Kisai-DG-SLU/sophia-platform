# Historique, non maintenu : runner d'intégration continue du socle de juin 2026, à l'arrêt (0 réplique) dans l'installation de référence, retrait en attente (voir README.md de ce dossier).
kind: NetworkPolicy
apiVersion: networking.k8s.io/v1
metadata:
  name: allow-runner-to-forgejo
  namespace: ${GIT_NAMESPACE}
spec:
  podSelector:
    matchLabels:
      app: forgejo
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ${RUNNER_NAME:-forgejo-runner-gpu}
    ports:
    - protocol: TCP
      port: 3000
