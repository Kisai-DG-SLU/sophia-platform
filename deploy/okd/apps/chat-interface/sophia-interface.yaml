# SophIA - Interface de production, namespace dédié sophia-interface : hors du namespace des
# applications, dont l'agent de déploiement est administrateur. Namespace, quota, LimitRange, classe
# de priorité sophia-chat et entrées des autres namespaces : préparés à part, avant ce manifeste.
# La Route de production est à part : appliquée à la bascule seulement, quand l'ancienne est supprimée
# (deux Routes ne réclament pas le même nom d'hôte). Essai avant bascule : une Route temporaire, joignable
# par le VPN seulement.
#
# Prérequis (l'administrateur, opérations sur les secrets), dans le namespace sophia-interface :
#   - secret sophia-interface-git     : clé de déploiement Forgejo en lecture seule (kubernetes.io/ssh-auth :
#                                       ssh-privatekey, known_hosts du SSH de Forgejo)
#   - secret sophia-interface-litellm : LITELLM_API_KEY = virtual key LiteLLM dédiée à la prod
#                                       et LITELLM_AUDIO_API_KEY (facultative) = virtual key limitée
#                                       à sophia-stt et sophia-tts (routes de la voix)
#   - secret sophia-interface-oauth2  : client-secret (client Keycloak sophia-interface) et cookie-secret
#   - secret sophia-interface-sessions: password = mot de passe de l'utilisateur d'ACL du chat dans le Valkey
#                                       des sessions (../../identity/sessions/README.md), créé avant ce manifeste
#   - secret sophia-chat-db           : PGHOST, PGPORT, PGDATABASE, PGUSER, PGPASSWORD (base sophia_chat)
#   - secret sophia-chat-forgejo      : FORGEJO_TOKEN du compte de service Forgejo « sophia-chat » (facultatif)
#
# Chemin d'une requête : Route → oauth2-proxy :4180 (connexion Keycloak, realm sophia)
# → nginx :8080 (front, liste blanche, clé LiteLLM, identité x-litellm-end-user-id) → LiteLLM.
#                └ /api/store/ → API des discussions 127.0.0.1:8000 → PostgreSQL sophia_chat.
# Application : README.md de ce dossier.
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: sophia-interface
  namespace: sophia-interface
  labels: { app: sophia-interface }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sophia-interface
  namespace: sophia-interface
  labels: { app: sophia-interface }
spec:
  source:
    type: Git
    git:
      # Clé de déploiement en lecture seule : jamais le jeton d'un administrateur de la forge.
      uri: ssh://git@forgejo-svc.sophia-git.svc.cluster.local:FORGEJO_SSH_PORT/ORGANISATION/chat-interface.git
      ref: main
    sourceSecret:
      name: sophia-interface-git
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: deploy/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: sophia-interface:latest
  runPolicy: Serial
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
  resources:
    limits: { cpu: "1", memory: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sophia-interface
  namespace: sophia-interface
  labels: { app: sophia-interface }
  annotations:
    # Nouveau build → nouvelle image → redéploiement automatique.
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"sophia-interface:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"interface\")].image"},{"from":{"kind":"ImageStreamTag","name":"sophia-interface:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"store-api\")].image"}]'
spec:
  replicas: 1
  selector:
    matchLabels: { app: sophia-interface }
  template:
    metadata:
      labels: { app: sophia-interface }
    spec:
      priorityClassName: sophia-chat
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: oauth2
          secret: { secretName: sophia-interface-oauth2, defaultMode: 0440 }
      containers:
        # Connexion obligatoire. Échanges serveur à serveur par le Service interne de
        # Keycloak (pas de TLS ni de DNS public à résoudre) ; le navigateur, lui, passe
        # par auth.apps.example.org. Les jetons portent l'émetteur public.
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          args:
            - --http-address=0.0.0.0:4180
            - --upstream=http://127.0.0.1:8080/
            - --reverse-proxy=true
            # Seul appelant admis à fournir X-Forwarded-* : le routeur d'OKD, en hostNetwork, qui joint le pod
            # depuis l'interface de gestion du réseau des pods du nœud (adresse relevée dans le journal
            # d'oauth2-proxy). Limite : tout processus en hostNetwork du nœud partage cette adresse.
            # /ping n'en dépend pas.
            - --trusted-proxy-ip=ROUTER_POD_SIDE_IP/32
            - --provider=keycloak-oidc
            - --client-id=sophia-interface
            - --client-secret-file=/etc/oauth2/client-secret
            - --cookie-secret-file=/etc/oauth2/cookie-secret
            - --cookie-name=_sophia
            - --cookie-secure=true
            - --cookie-refresh=4m           # sous les 5 min du jeton d'accès de Keycloak : le jeton relayé reste valide
            - --cookie-expire=2160h          # 90 jours, comme la session Keycloak « Se souvenir de moi »
            - --redirect-url=https://chat.example.org/oauth2/callback
            - --whitelist-domain=chat.example.org
            - --oidc-issuer-url=https://auth.apps.example.org/realms/sophia
            - --skip-oidc-discovery=true
            - --login-url=https://auth.apps.example.org/realms/sophia/protocol/openid-connect/auth
            - --redeem-url=http://sophia-keycloak-service.sophia-identity.svc:8080/realms/sophia/protocol/openid-connect/token
            - --oidc-jwks-url=http://sophia-keycloak-service.sophia-identity.svc:8080/realms/sophia/protocol/openid-connect/certs
            - --backend-logout-url=http://sophia-keycloak-service.sophia-identity.svc:8080/realms/sophia/protocol/openid-connect/logout?id_token_hint={id_token}
            - --scope=openid profile email
            - --code-challenge-method=S256
            - --email-domain=*
            # Un utilisateur sans groupe n'entre pas.
            - --allowed-group=admin
            - --allowed-group=responsables
            - --allowed-group=proteges
            - --allowed-group=invites
            - --pass-user-headers=true
            - --skip-provider-button=true
            - --silence-ping-logging=true
            # Délai d'attente du premier octet de réponse : 30 s par défaut, trop court pour une
            # photo, une première compaction ou un long document (lecture ≈ 420 tokens/s sur le GPU).
            # Aligné sur nginx (proxy_read_timeout 300s).
            - --upstream-timeout=300s
            # École sur sa propre adresse : retour après connexion vers l'école, et préflight CORS
            # (sans cookie) transmis à nginx, qui ne répond qu'à l'origine exacte de l'école.
            - --whitelist-domain=ecole.example.org
            - --skip-auth-preflight=true
            # Jeton d'accès de la personne vers nginx (X-Forwarded-Access-Token ; une valeur envoyée par le navigateur
            # est retirée avant). nginx ne le relaie qu'à store-api sur /v1/chat/completions (X-Sophia-Jeton).
            - --pass-access-token=true
            # Sessions côté serveur : le cookie _sophia ne porte qu'un ticket, la session va dans le Valkey
            # réservé aux sessions (../../identity/sessions/), clé _sophia-<ticket>, durée --cookie-expire.
            # Utilisateur ACL du chat, limité aux clés _sophia-*. Un ancien cookie entier n'est plus lu : il est
            # effacé et la personne se reconnecte une fois. Les anciens morceaux _sophia_N restent dans le
            # navigateur jusqu'à leur expiration : d'où large_client_header_buffers dans nginx.conf.in.
            - --session-store-type=redis
            - --redis-connection-url=redis://valkey-sessions.sophia-identity.svc.cluster.local:6379/0
            - --redis-username=sophia-interface
          env:
            - name: OAUTH2_PROXY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: sophia-interface-sessions, key: password }
          ports:
            - { name: http, containerPort: 4180 }
          volumeMounts:
            - { name: oauth2, mountPath: /etc/oauth2, readOnly: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
        - name: interface
          image: sophia-interface:latest
          ports:
            - { name: nginx, containerPort: 8080 }
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef: { name: sophia-interface-litellm, key: LITELLM_API_KEY }
            # Clé limitée aux modèles audio locaux (routes de la voix) ; facultative : absente, clé du pod.
            - name: LITELLM_AUDIO_API_KEY
              valueFrom:
                secretKeyRef: { name: sophia-interface-litellm, key: LITELLM_AUDIO_API_KEY, optional: true }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /, port: nginx }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: nginx }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
        # API des discussions : n'écoute que dans le pod, derrière nginx.
        - name: store-api
          image: sophia-interface:latest
          workingDir: /mnt/prod
          command: [python3.12, -m, uvicorn, api.app:app, --host, 127.0.0.1, --port, "8000", --no-access-log]
          envFrom:
            - secretRef: { name: sophia-chat-db }
            - secretRef: { name: sophia-chat-forgejo, optional: true }
          env:
            - { name: SOPHIA_FAMILY_ORG, value: famille }
            - { name: SOPHIA_BRAIN_REPO, value: ORGANISATION/brain }
            - { name: SOPHIA_PROMOTE_TARGETS, value: '{"famille": "Famille", "perso": "Perso"}' }
            # Modèle par défaut (profil sans choix explicite, journal) : inférence locale, rien ne sort du cluster.
            - { name: SOPHIA_DEFAULT_MODEL, value: sophia-local }
            # Fenêtre de contexte par modèle, en tokens : au-delà, refus expliqué
            # avant le routeur. sophia-local : 4 × 61 440 (cache partagé en 8 bits du serveur d'inférence).
            - { name: SOPHIA_CONTEXT_LIMITS, value: '{"sophia-local": 61440, "sophia-routine": 64000, "sophia-think": 64000, "sophia-architect": 32000}' }
            # Recherche web (PWeb) : serveur sophia-web du sas. Vide = pas de recherche.
            - { name: SOPHIA_WEB_URL, value: "http://sophia-web.sophia-dmz.svc.cluster.local:8000" }
            # Serveurs MCP dont l'API propose les outils au modèle, dans cet ordre (annonces et affichage :
            # deploy/okd/skills/README.md). Un module qui expose ses outils s'ajoute à la liste
            # (ex. http://<module>.sophia-apps.svc.cluster.local:8081/mcp) et à la sortie réseau ci-dessous.
            - name: SOPHIA_MCP_URLS
              value: "http://sophia-web.sophia-dmz.svc.cluster.local:8000/mcp,http://sophia-geo.sophia-skills.svc.cluster.local:8000/mcp,http://sophia-image.sophia-skills.svc.cluster.local:8000/mcp,http://mcp-fichiers.sophia-skills.svc.cluster.local:8000/mcp"
            # Seuls serveurs MCP qui reçoivent le jeton d'accès de la personne (outils à méta sophia/jeton)
            - name: SOPHIA_MCP_JETON_URLS
              value: "http://mcp-fichiers.sophia-skills.svc.cluster.local:8000/mcp"
            # Cache de secours de la météo : jeton partagé avec le service web, pour envoyer la liste anonyme des
            # communes des lieux enregistrés. Facultatif : sans le Secret, rien n'est envoyé. Jamais journalisé.
            - name: SOPHIA_WEB_CACHE_JETON
              valueFrom:
                secretKeyRef: { name: sophia-web-cache, key: jeton, optional: true }
            # Cockpit : modules affichés au centre, en cadre (les autres s'ouvrent à part). Chaque module listé
            # doit poser frame-ancestors pour l'origine du chat et envoyer le signal sophia.pret avec cet
            # identifiant exact. Changer la liste : oc apply, sans build. Voir README.md, section Cockpit.
            - { name: SOPHIA_MODULES_CADRE, value: "cuisine,ecole,workflow,messages,visio,bureau" }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            exec: { command: [python3.12, -c, "import urllib.request,sys; r=urllib.request.Request('http://127.0.0.1:8000/api/store/health', headers={'X-Sophia-User':'sonde'}); sys.exit(0 if urllib.request.urlopen(r, timeout=3).status==200 else 1)"] }
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sophia-interface
  namespace: sophia-interface
  labels: { app: sophia-interface }
spec:
  selector: { app: sophia-interface }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
# Entrée : seul le routeur OpenShift, vers oauth2-proxy (nginx :8080 n'est joignable
# que depuis le pod lui-même). Sortie : LiteLLM, Keycloak, PostgreSQL, Forgejo, le sas web,
# les serveurs MCP de sophia-skills et des modules, l'école (index des contenus et catalogue des avatars, lus par l'API) et le DNS du cluster.
# Ne vise que les pods de l'interface (les pods de build ont leurs propres règles de namespace).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sophia-interface
  namespace: sophia-interface
  labels: { app: sophia-interface }
spec:
  podSelector:
    matchLabels: { app: sophia-interface }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { policy-group.network.openshift.io/ingress: "" }
      ports:
        - { protocol: TCP, port: 4180 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-core }
          podSelector:
            matchLabels: { app: litellm }
      ports:
        - { protocol: TCP, port: 4000 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-identity }
      ports:
        - { protocol: TCP, port: 8080 }
    # Valkey des sessions d'oauth2-proxy (entrée valkey-sessions-ingress, ../../identity/sessions/)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-identity }
          podSelector:
            matchLabels: { app: valkey-sessions }
      ports:
        - { protocol: TCP, port: 6379 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-core }
          podSelector:
            matchLabels: { app: postgres-sophia }
        # PostgreSQL 18 : l'ancienne instance reste ouverte pendant la garde qui suit la migration, pour un retour arrière
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-core }
          podSelector:
            matchLabels: { app: postgres-sophia-18 }
      ports:
        - { protocol: TCP, port: 5432 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-git }
      ports:
        - { protocol: TCP, port: 3000 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-dmz }
          podSelector:
            matchLabels: { app: sophia-web }
      ports:
        - { protocol: TCP, port: 8000 }
    # Serveurs MCP sans Internet (sophia-skills : géographie, images…), port MCP 8000
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-skills }
          podSelector:
            matchLabels: { sophia-mcp: "true" }
      ports:
        - { protocol: TCP, port: 8000 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-apps }
          podSelector:
            matchLabels: { app: sophia-school }
      ports:
        - { protocol: TCP, port: 8080 }
    # Un module qui expose un serveur MCP (namespace des applications) : un bloc par module
    # - to:
    #     - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: sophia-apps } }
    #       podSelector: { matchLabels: { app: <module> } }
    #   ports:
    #     - { protocol: TCP, port: 8081 }
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: openshift-dns }
      ports:
        - { protocol: UDP, port: 5353 }
        - { protocol: TCP, port: 5353 }
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
