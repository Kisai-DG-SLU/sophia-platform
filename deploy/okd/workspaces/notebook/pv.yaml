# Historique, non maintenu : espace de notebooks du socle de juin 2026, jamais déployé dans l'installation de référence (voir README.md de ce dossier).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-sophia-notebook-workspace
spec:
  capacity:
    storage: 20Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: ${NOTEBOOK_MOUNT_POINT}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - "${NODE_NAME}"
