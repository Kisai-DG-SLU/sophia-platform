# Réglages de la surveillance des charges utilisateur. À appliquer APRÈS 00-cluster-monitoring-config.yaml,
# une fois le namespace openshift-user-workload-monitoring créé par l'opérateur.
# - Alertmanager propre aux charges utilisateur, avec AlertmanagerConfig par namespace
#   (30-alertmanager-config.yaml : prêt, non activé) ;
# - rétention de 15 jours ; ressources bornées (le CPU est la ressource rare du nœud, pas la mémoire).
apiVersion: v1
kind: ConfigMap
metadata:
  name: user-workload-monitoring-config
  namespace: openshift-user-workload-monitoring
data:
  config.yaml: |
    prometheus:
      retention: 15d
      resources:
        requests: { cpu: 100m, memory: 1Gi }
        limits: { cpu: "1", memory: 3Gi }
    thanosRuler:
      resources:
        requests: { cpu: 20m, memory: 128Mi }
        limits: { cpu: 500m, memory: 512Mi }
    alertmanager:
      enabled: true
      enableAlertmanagerConfig: true
      resources:
        requests: { cpu: 10m, memory: 64Mi }
        limits: { cpu: 200m, memory: 256Mi }
