# Flux de Temporal. Les NetworkPolicies s'additionnent.
---
# Temporal : clients gRPC depuis le répartiteur (seul client applicatif : les agents n'ont aucun
# accès à Temporal), l'interface Temporal et les Jobs d'administration ;
# tous ports entre pods Temporal (appartenance, services internes dont le frontend interne 7236).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: temporal-ingress
  namespace: sophia-core
spec:
  podSelector:
    matchLabels: { app: temporal }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: repartiteur }
        - podSelector:
            matchLabels: { app: temporal-ui }
        # Jobs d'administration (namespace, recette)
        - podSelector:
            matchLabels: { app: temporal-admin }
      ports:
        - { protocol: TCP, port: 7233 }
    - from:
        - podSelector:
            matchLabels: { app: temporal }
---
# PostgreSQL accepte Temporal et son Job de schémas
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-temporal-to-postgres
  namespace: sophia-core
spec:
  podSelector:
    matchLabels: { app: postgres-sophia }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: temporal }
        - podSelector:
            matchLabels: { app: temporal-schema }
      ports:
        - { protocol: TCP, port: 5432 }
