# 1. On bloque tout le trafic sortant de sophia-core, sauf les exceptions ci-dessous.
#    Réseaux des Services et des pods : valeurs par défaut d'OKD (oc get network.config cluster).
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  namespace: sophia-core
spec:
  egress:
  - type: Allow
    to:
      cidrSelector: 172.30.0.0/16 # Services internes OKD (vital pour le DNS)
  - type: Allow
    to:
      cidrSelector: 10.128.0.0/14 # Pods du cluster
  # Builds et images : GitHub (ghcr), PyPI, Docker Hub
  - type: Allow
    to:
      dnsName: ghcr.io
  - type: Allow
    to:
      dnsName: pkg-containers.githubusercontent.com
  - type: Allow
    to:
      dnsName: objects.githubusercontent.com
  - type: Allow
    to:
      dnsName: api.deepinfra.com  # fournisseur des modèles distants
  - type: Allow
    to:
      dnsName: pypi.org
  - type: Allow
    to:
      dnsName: files.pythonhosted.org
  - type: Allow
    to:
      dnsName: pypi.python.org
  - type: Allow
    to:
      dnsName: registry-1.docker.io
  - type: Allow
    to:
      dnsName: auth.docker.io
  - type: Allow
    to:
      dnsName: production.cloudflare.docker.com
  # RabbitMQ lit les clés de signature de Keycloak en HTTPS par le routeur (le nom
  # résout vers l'adresse du nœud, hors des réseaux autorisés ci-dessus)
  - type: Allow
    to:
      dnsName: ${IDP_HOST}
    ports:
    - protocol: TCP
      port: 443
  # API Kubernetes (TokenReview du répartiteur) : le Service kubernetes.default aboutit à
  # l'adresse du nœud, port 6443, que le refus ci-dessous couperait.
  - type: Allow
    to:
      nodeSelector:
        matchLabels: { node-role.kubernetes.io/control-plane: "" }
    ports:
    - protocol: TCP
      port: 6443
  - type: Deny
    to:
      cidrSelector: 0.0.0.0/0     # Blocage de tout le reste
---
# 2. On protège Postgres : IL N'ACCEPTE QUE LiteLLM
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-litellm-to-postgres
  namespace: sophia-core
spec:
  podSelector:
    matchLabels:
      app: postgres-sophia
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: litellm
    ports:
    - protocol: TCP
      port: 5432
