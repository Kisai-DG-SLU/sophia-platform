# Complète la configuration par défaut de l'image (/etc/rabbitmq/conf.d/10-defaults.conf).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: sophia-core
  labels: { app: rabbitmq }
data:
  # Remplace celui de l'image (management + prometheus) : ajoute l'authentification OAuth2
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_auth_backend_oauth2].
  # Comptes du vhost /sophia. Gabarit sans secret : l'initContainer « definitions » remplace
  # chaque @PW_<compte>@ par la clé <compte> du Secret rabbitmq-users, et RabbitMQ importe le résultat
  # à chaque démarrage (mot de passe haché à l'import ; comptes absents du fichier non touchés).
  # RabbitMQ ne porte plus que les événements (les délégations passent par Temporal). Toute la
  # topologie est ici, déclarée par l'import, aucune par les clients :
  #  - sophia.events (topic) : événements des délégations, clé <demandeur>.delegate.<événement> ;
  #  - DLQ : sophia.dlx (fanout) → sophia.dlq (quorum, 30 j, 10 000 messages), lue par l'administrateur ;
  #    gardée pour de futures files durables (aucune aujourd'hui).
  # Les agents n'ont plus de compte : ce sont des exécutants, joints par le seul répartiteur, qui ne
  # sont pas clients du bus. L'import ne supprimant rien, un compte, une file ou un exchange retiré
  # d'ici se retire aussi du serveur, à part (README, « Retirer un compte ou une file »).
  # repartiteur : seul éditeur sur sophia.events, clés <demandeur>.delegate.<événement> seulement
  # (topic_permissions), user_id toujours posé (vérifié par RabbitMQ), ne configure rien (passive=True).
  # sophia-workflow : relais SSE en direct, file exclusive amq.gen-* liée à sophia.events, sans publier.
  # L'administrateur interne (Secret rabbitmq-admin-creds) y figure aussi : avec des définitions,
  # RabbitMQ ne crée plus RABBITMQ_DEFAULT_USER sur un volume neuf.
  definitions.template.json: |
    {
      "vhosts": [
        {
          "name": "/sophia"
        }
      ],
      "users": [
        {
          "name": "@ADMIN_USER@",
          "password": "@ADMIN_PW@",
          "tags": [
            "administrator"
          ]
        },
        {
          "name": "sophia-workflow",
          "password": "@PW_sophia-workflow@",
          "tags": []
        },
        {
          "name": "repartiteur",
          "password": "@PW_repartiteur@",
          "tags": []
        }
      ],
      "permissions": [
        {
          "user": "@ADMIN_USER@",
          "vhost": "/sophia",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        },
        {
          "user": "sophia-workflow",
          "vhost": "/sophia",
          "configure": "^amq\\.gen-.*$",
          "write": "^amq\\.gen-.*$",
          "read": "^(sophia\\.events|amq\\.gen-.*)$"
        },
        {
          "user": "repartiteur",
          "vhost": "/sophia",
          "configure": "",
          "write": "^sophia\\.events$",
          "read": ""
        }
      ],
      "exchanges": [
        {
          "name": "sophia.events",
          "vhost": "/sophia",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
        {
          "name": "sophia.dlx",
          "vhost": "/sophia",
          "type": "fanout",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "queues": [
        {
          "name": "sophia.dlq",
          "vhost": "/sophia",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        }
      ],
      "bindings": [
        {
          "source": "sophia.dlx",
          "vhost": "/sophia",
          "destination": "sophia.dlq",
          "destination_type": "queue",
          "routing_key": "",
          "arguments": {}
        }
      ],
      "policies": [
        {
          "vhost": "/sophia",
          "name": "sophia-dlq",
          "pattern": "^sophia\\.dlq$",
          "apply-to": "quorum_queues",
          "priority": 10,
          "definition": {
            "overflow": "drop-head",
            "max-length": 10000,
            "message-ttl": 2592000000
          }
        }
      ],
      "topic_permissions": [
        {
          "user": "repartiteur",
          "vhost": "/sophia",
          "exchange": "sophia.events",
          "write": "^[a-z]+\\.delegate\\.[a-z_]+$",
          "read": "^$"
        }
      ]
    }
  20-sophia.conf: |
    # RabbitMQ lit la mémoire du nœud, pas la limite du conteneur : sans cette valeur,
    # son seuil d'alerte (60 %) ne se déclencherait jamais avant l'OOM. Doit suivre limits.memory.
    total_memory_available_override_value = 1073741824
    # Publications suspendues sous 1 Go libre (50 Mo par défaut) ; le volume est sur le disque système
    disk_free_limit.absolute = 1GB
    # Journal des files quorum : 512 Mo en mémoire par défaut, presque tout le seuil de 614 Mo
    raft.wal_max_size_bytes = 67108864

    # --- Interface d'administration derrière Keycloak (realm sophia, client rabbitmq) ---
    # Jetons OAuth2 d'abord, comptes internes ensuite (répartiteur et relais en AMQP, administrateur du Secret)
    auth_backends.1 = rabbit_auth_backend_oauth2
    auth_backends.2 = rabbit_auth_backend_internal
    auth_oauth2.resource_server_id = rabbitmq
    auth_oauth2.issuer = https://${IDP_HOST}/realms/sophia
    # HTTPS obligatoire (l'adresse interne de Keycloak est en HTTP) : passe par le routeur
    auth_oauth2.jwks_uri = https://${IDP_HOST}/realms/sophia/protocol/openid-connect/certs
    auth_oauth2.https.peer_verification = verify_peer
    auth_oauth2.https.cacertfile = /etc/ssl/certs/ca-certificates.crt
    # Certificat joker du routeur (*.apps.<domaine du cluster>)
    auth_oauth2.https.hostname_verification = wildcard
    auth_oauth2.preferred_username_claims.1 = preferred_username
    # Les groupes Keycloak (claim « groups ») deviennent des scopes ; seul « admin » ouvre des droits
    auth_oauth2.additional_scopes_key = groups
    auth_oauth2.scope_aliases.admin = rabbitmq.tag:administrator rabbitmq.read:*/* rabbitmq.write:*/* rabbitmq.configure:*/*
    management.oauth_enabled = true
    management.oauth_client_id = rabbitmq
    management.oauth_provider_url = https://${IDP_HOST}/realms/sophia
    management.oauth_scopes = openid profile
    # Plus de connexion par mot de passe à l'interface ni à l'API HTTP
    management.oauth_disable_basic_auth = true

    # --- Comptes et droits importés au démarrage (voir definitions.template.json) ---
    definitions.import_backend = local_filesystem
    definitions.local.path = /run/rabbitmq-definitions/definitions.json
