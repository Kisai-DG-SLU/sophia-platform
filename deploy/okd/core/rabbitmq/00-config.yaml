# Complète la configuration par défaut de l'image (/etc/rabbitmq/conf.d/10-defaults.conf).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: rabbitmq-config
  namespace: sophia-core
  labels: { app: rabbitmq }
data:
  # Remplace celui de l'image (management + prometheus) : ajoute l'authentification OAuth2
  enabled_plugins: |
    [rabbitmq_management,rabbitmq_prometheus,rabbitmq_auth_backend_oauth2].
  # Comptes du vhost /sophia. Gabarit sans secret : l'initContainer « definitions » remplace
  # chaque @PW_<compte>@ par la clé <compte> du Secret rabbitmq-users, et RabbitMQ importe le résultat
  # à chaque démarrage (mot de passe haché à l'import ; comptes absents du fichier non touchés).
  # RabbitMQ ne porte plus que les événements et les messages simples (les délégations passent
  # par Temporal). Toute la topologie est ici, déclarée par l'import, aucune par les clients :
  #  - sophia.agents (direct) : message simple à un agent, clé = nom de l'agent → file quorum
  #    sophia.agent.<nom> ; sophia.events (topic) : DelegateEvent et autres, clé <agent>.<événement> ;
  #  - DLQ : sophia.dlx (fanout) → sophia.dlq (quorum, 30 j, 10 000 messages), lue par l'administrateur ;
  #    une file d'agent y envoie un message refusé ou livré 5 fois sans ack (at-least-once), et refuse
  #    les publications au-delà de 10 000 messages (l'émetteur reçoit un nack, rien n'est perdu en silence).
  # Droits : les agents n'écrivent nulle part (exécutants, joints par le répartiteur seul) ; ils gardent
  # la lecture de leur file, sans usage, en attendant son retrait.
  # repartiteur : seul éditeur sur sophia.events, clés <demandeur>.delegate.<événement> seulement
  # (topic_permissions), user_id toujours posé (vérifié par RabbitMQ), ne configure rien (passive=True).
  # sophia-workflow : relais SSE en direct, file exclusive amq.gen-* liée à sophia.events, sans publier.
  # L'administrateur interne (Secret rabbitmq-admin-creds) y figure aussi : avec des définitions,
  # RabbitMQ ne crée plus RABBITMQ_DEFAULT_USER sur un volume neuf.
  definitions.template.json: |
    {
      "vhosts": [
        {
          "name": "/sophia"
        }
      ],
      "users": [
        {
          "name": "@ADMIN_USER@",
          "password": "@ADMIN_PW@",
          "tags": [
            "administrator"
          ]
        },
        {
          "name": "sophia",
          "password": "@PW_sophia@",
          "tags": []
        },
        {
          "name": "athena",
          "password": "@PW_athena@",
          "tags": []
        },
        {
          "name": "hephaistos",
          "password": "@PW_hephaistos@",
          "tags": []
        },
        {
          "name": "ouranos",
          "password": "@PW_ouranos@",
          "tags": []
        },
        {
          "name": "dionysos",
          "password": "@PW_dionysos@",
          "tags": []
        },
        {
          "name": "sophia-workflow",
          "password": "@PW_sophia-workflow@",
          "tags": []
        },
        {
          "name": "repartiteur",
          "password": "@PW_repartiteur@",
          "tags": []
        }
      ],
      "permissions": [
        {
          "user": "@ADMIN_USER@",
          "vhost": "/sophia",
          "configure": ".*",
          "write": ".*",
          "read": ".*"
        },
        {
          "user": "sophia",
          "vhost": "/sophia",
          "configure": "",
          "write": "",
          "read": "^sophia\\.agent\\.sophia$"
        },
        {
          "user": "athena",
          "vhost": "/sophia",
          "configure": "",
          "write": "",
          "read": "^sophia\\.agent\\.athena$"
        },
        {
          "user": "hephaistos",
          "vhost": "/sophia",
          "configure": "",
          "write": "",
          "read": "^sophia\\.agent\\.hephaistos$"
        },
        {
          "user": "ouranos",
          "vhost": "/sophia",
          "configure": "",
          "write": "",
          "read": "^sophia\\.agent\\.ouranos$"
        },
        {
          "user": "dionysos",
          "vhost": "/sophia",
          "configure": "",
          "write": "",
          "read": "^sophia\\.agent\\.dionysos$"
        },
        {
          "user": "sophia-workflow",
          "vhost": "/sophia",
          "configure": "^amq\\.gen-.*$",
          "write": "^amq\\.gen-.*$",
          "read": "^(sophia\\.events|amq\\.gen-.*)$"
        },
        {
          "user": "repartiteur",
          "vhost": "/sophia",
          "configure": "",
          "write": "^sophia\\.events$",
          "read": ""
        }
      ],
      "exchanges": [
        {
          "name": "sophia.agents",
          "vhost": "/sophia",
          "type": "direct",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
        {
          "name": "sophia.events",
          "vhost": "/sophia",
          "type": "topic",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        },
        {
          "name": "sophia.dlx",
          "vhost": "/sophia",
          "type": "fanout",
          "durable": true,
          "auto_delete": false,
          "internal": false,
          "arguments": {}
        }
      ],
      "queues": [
        {
          "name": "sophia.agent.sophia",
          "vhost": "/sophia",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        },
        {
          "name": "sophia.agent.athena",
          "vhost": "/sophia",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        },
        {
          "name": "sophia.agent.hephaistos",
          "vhost": "/sophia",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        },
        {
          "name": "sophia.agent.ouranos",
          "vhost": "/sophia",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        },
        {
          "name": "sophia.agent.dionysos",
          "vhost": "/sophia",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        },
        {
          "name": "sophia.dlq",
          "vhost": "/sophia",
          "durable": true,
          "auto_delete": false,
          "arguments": {
            "x-queue-type": "quorum"
          }
        }
      ],
      "bindings": [
        {
          "source": "sophia.agents",
          "vhost": "/sophia",
          "destination": "sophia.agent.sophia",
          "destination_type": "queue",
          "routing_key": "sophia",
          "arguments": {}
        },
        {
          "source": "sophia.agents",
          "vhost": "/sophia",
          "destination": "sophia.agent.athena",
          "destination_type": "queue",
          "routing_key": "athena",
          "arguments": {}
        },
        {
          "source": "sophia.agents",
          "vhost": "/sophia",
          "destination": "sophia.agent.hephaistos",
          "destination_type": "queue",
          "routing_key": "hephaistos",
          "arguments": {}
        },
        {
          "source": "sophia.agents",
          "vhost": "/sophia",
          "destination": "sophia.agent.ouranos",
          "destination_type": "queue",
          "routing_key": "ouranos",
          "arguments": {}
        },
        {
          "source": "sophia.agents",
          "vhost": "/sophia",
          "destination": "sophia.agent.dionysos",
          "destination_type": "queue",
          "routing_key": "dionysos",
          "arguments": {}
        },
        {
          "source": "sophia.dlx",
          "vhost": "/sophia",
          "destination": "sophia.dlq",
          "destination_type": "queue",
          "routing_key": "",
          "arguments": {}
        }
      ],
      "policies": [
        {
          "vhost": "/sophia",
          "name": "sophia-agents",
          "pattern": "^sophia\\.agent\\.[a-z-]+$",
          "apply-to": "quorum_queues",
          "priority": 10,
          "definition": {
            "dead-letter-exchange": "sophia.dlx",
            "dead-letter-strategy": "at-least-once",
            "overflow": "reject-publish",
            "delivery-limit": 5,
            "max-length": 10000
          }
        },
        {
          "vhost": "/sophia",
          "name": "sophia-dlq",
          "pattern": "^sophia\\.dlq$",
          "apply-to": "quorum_queues",
          "priority": 10,
          "definition": {
            "overflow": "drop-head",
            "max-length": 10000,
            "message-ttl": 2592000000
          }
        }
      ],
      "topic_permissions": [
        {
          "user": "repartiteur",
          "vhost": "/sophia",
          "exchange": "sophia.events",
          "write": "^[a-z]+\\.delegate\\.[a-z_]+$",
          "read": "^$"
        }
      ]
    }
  20-sophia.conf: |
    # RabbitMQ lit la mémoire du nœud, pas la limite du conteneur : sans cette valeur,
    # son seuil d'alerte (60 %) ne se déclencherait jamais avant l'OOM. Doit suivre limits.memory.
    total_memory_available_override_value = 1073741824
    # Publications suspendues sous 1 Go libre (50 Mo par défaut) ; le volume est sur le disque système
    disk_free_limit.absolute = 1GB
    # Journal des files quorum : 512 Mo en mémoire par défaut, presque tout le seuil de 614 Mo
    raft.wal_max_size_bytes = 67108864

    # --- Interface d'administration derrière Keycloak (realm sophia, client rabbitmq) ---
    # Jetons OAuth2 d'abord, comptes internes ensuite (agents en AMQP, administrateur du Secret)
    auth_backends.1 = rabbit_auth_backend_oauth2
    auth_backends.2 = rabbit_auth_backend_internal
    auth_oauth2.resource_server_id = rabbitmq
    auth_oauth2.issuer = https://${IDP_HOST}/realms/sophia
    # HTTPS obligatoire (l'adresse interne de Keycloak est en HTTP) : passe par le routeur
    auth_oauth2.jwks_uri = https://${IDP_HOST}/realms/sophia/protocol/openid-connect/certs
    auth_oauth2.https.peer_verification = verify_peer
    auth_oauth2.https.cacertfile = /etc/ssl/certs/ca-certificates.crt
    # Certificat joker du routeur (*.apps.<domaine du cluster>)
    auth_oauth2.https.hostname_verification = wildcard
    auth_oauth2.preferred_username_claims.1 = preferred_username
    # Les groupes Keycloak (claim « groups ») deviennent des scopes ; seul « admin » ouvre des droits
    auth_oauth2.additional_scopes_key = groups
    auth_oauth2.scope_aliases.admin = rabbitmq.tag:administrator rabbitmq.read:*/* rabbitmq.write:*/* rabbitmq.configure:*/*
    management.oauth_enabled = true
    management.oauth_client_id = rabbitmq
    management.oauth_provider_url = https://${IDP_HOST}/realms/sophia
    management.oauth_scopes = openid profile
    # Plus de connexion par mot de passe à l'interface ni à l'API HTTP
    management.oauth_disable_basic_auth = true

    # --- Comptes et droits importés au démarrage (voir definitions.template.json) ---
    definitions.import_backend = local_filesystem
    definitions.local.path = /run/rabbitmq-definitions/definitions.json
