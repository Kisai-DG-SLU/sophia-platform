# Interface d'administration (15672) depuis le routeur ; l'accès passe par Keycloak.
# L'entrée AMQP du répartiteur est dans ../repartiteur/04-network-policy.yaml.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-management-from-router
  namespace: sophia-core
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - port: 15672
          protocol: TCP
  policyTypes:
    - Ingress
---
# Relais de visualisation : lecture de sophia.events (compte sophia-workflow), depuis son propre
# namespace, sans aucun compte d'agent lié. À appliquer avec le déploiement du relais.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-from-workflow-collecteur
  namespace: sophia-core
spec:
  podSelector:
    matchLabels:
      app: rabbitmq
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ${VIEWER_NAMESPACE}
          podSelector:
            matchLabels:
              app: sophia-workflow-collecteur
      ports:
        - port: 5672
          protocol: TCP
  policyTypes:
    - Ingress
