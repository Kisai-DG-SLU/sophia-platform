apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: build-sophia-litellm
  namespace: sophia-core
spec:
  source:
    type: Git
    git:
      uri: ${CONFIG_REPO_URL}      # dépôt Git interne qui contient ce dossier
    sourceSecret:
      name: forgejo-creds
    contextDir: deploy/okd/core/litellm
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  # Le pod de build compte dans le quota de sophia-core (voir ../00-namespace-guardrails.yaml)
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "2", memory: 4Gi }
  output:
    to:
      kind: ImageStreamTag
      name: sophia-litellm:latest
