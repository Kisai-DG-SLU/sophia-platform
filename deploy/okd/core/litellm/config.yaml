apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: sophia-core
data:
  config.yaml: |
    # Tarifs : input/output_cost_per_token des modèles deepinfra/ sont recopiés
    # de l'API DeepInfra par sync-pricing.py (même dossier), jamais à la main.
    # custom_cost_map.json n'est pas pris en compte par LiteLLM (mesuré).
    model_list:
      - model_name: sophia-routine
        litellm_params:
          model: deepinfra/deepseek-ai/DeepSeek-V4-Flash
          api_key: "os.environ/DEEPINFRA_API_KEY"
          # Tarif DeepInfra synchronisé le 2026-10-15 ($/M : 0.09 → 0.18)
          input_cost_per_token: 0.00000009
          output_cost_per_token: 0.00000018

      - model_name: sophia-think
        litellm_params:
          model: deepinfra/deepseek-ai/DeepSeek-V4-Pro
          api_key: "os.environ/DEEPINFRA_API_KEY"
          # Tarif DeepInfra synchronisé le 2026-10-15 ($/M : 1.3 → 2.6)
          input_cost_per_token: 0.0000013
          output_cost_per_token: 0.0000026

      - model_name: sophia-architect
        litellm_params:
          model: deepinfra/NousResearch/Hermes-3-Llama-3.1-405B
          api_key: "os.environ/DEEPINFRA_API_KEY"
          # Tarif DeepInfra synchronisé le 2026-10-15 ($/M : 1 → 1)
          input_cost_per_token: 0.000001
          output_cost_per_token: 0.000001

      # Inférence locale (P0) : llama.cpp sur l'A2, Qwen3.5-9B Q6_K, dans sophia-inference.
      # Gratuit (coût 0) ; aucune donnée ne sort du cluster. Appels d'outils : --jinja côté serveur.
      - model_name: sophia-local
        litellm_params:
          model: openai/sophia-local
          api_base: http://llama-server.sophia-inference.svc.cluster.local:8080/v1
          api_key: "aucune"
          timeout: 600
          input_cost_per_token: 0
          output_cost_per_token: 0
        model_info:
          supports_function_calling: true
          supports_vision: true
          max_input_tokens: 61440

      # Voix (PVoix) : sophia-voice sur CPU, dans sophia-inference. Gratuit, rien ne sort du cluster.
      - model_name: sophia-stt
        litellm_params:
          model: openai/sophia-stt
          api_base: http://sophia-voice.sophia-inference.svc.cluster.local:8000/v1
          api_key: "aucune"
          timeout: 120
          input_cost_per_second: 0
        model_info:
          mode: audio_transcription

      - model_name: sophia-tts
        litellm_params:
          model: openai/sophia-tts
          api_base: http://sophia-voice.sophia-inference.svc.cluster.local:8000/v1
          api_key: "aucune"
          timeout: 120
          input_cost_per_character: 0
        model_info:
          mode: audio_speech

    litellm_settings:
      success_callback: ["local"]
      failure_callback: ["local"]
      set_completed_by: true

    general_settings:
      database_url: "os.environ/DATABASE_URL"
      master_key: "os.environ/LITELLM_MASTER_KEY"
      allow_unmapped_models: true

  custom_cost_map.json: |
    {
      "deepinfra/deepseek-ai/DeepSeek-V4-Flash": {
        "input_cost_per_token": 0.00000007,
        "output_cost_per_token": 0.00000007,
        "max_tokens": 8192,
        "max_input_tokens": 64000,
        "litellm_provider": "deepinfra"
      },
      "deepinfra/deepseek-ai/DeepSeek-V4-Pro": {
        "input_cost_per_token": 0.00000055,
        "output_cost_per_token": 0.00000055,
        "max_tokens": 8192,
        "max_input_tokens": 64000,
        "litellm_provider": "deepinfra"
      }
    }
