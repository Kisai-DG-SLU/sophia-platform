apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: litellm-route
  namespace: sophia-core
  annotations:
    # Requêtes longues (flux, gros modèles)
    haproxy.router.openshift.io/timeout: 900s
spec:
  host: ${LITELLM_HOST}   # nom DNS vers l'adresse du VPN
  to:
    kind: Service
    name: litellm-svc
    weight: 100
  port:
    targetPort: 4000
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

