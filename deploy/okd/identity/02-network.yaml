# PIdent.2/3 — Flux réseau de l'identité.
---
# Keycloak : entrée depuis le routeur (navigateurs, et les clients qui passent par le nom public), et depuis
# les seuls clients OIDC qui l'appellent par son Service interne (proxys OIDC, échanges serveur à serveur), sur
# 8080 seulement ; depuis le namespace lui-même (operator, Jobs d'import) sur 8080 et 9000. Le cluster
# Infinispan (7800, 57800) est ouvert par la politique de l'opérateur, entre pods Keycloak.
# Mêmes pairs que spec.networkPolicy.http de 03-keycloak.yaml : un client de plus par le Service interne =
# une ligne dans les DEUX listes, sinon sa connexion échoue. Les étiquettes « app » sont celles de votre
# installation (une par application). Sortie non restreinte à ce stade : l'operator parle à l'API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sophia-identity-ingress
  namespace: sophia-identity
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { policy-group.network.openshift.io/ingress: "" }
        # oauth2-proxy des applications de sophia-apps (pas les pods de build)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-apps }
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [ecole, recettes, courses, finances] }
        # navigateur distant du module Courses (oauth2-proxy), dans le sas
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-dmz }
          podSelector:
            matchLabels: { app: courses-navigateur }
        # outil MCP des fichiers (échange de jeton, clés)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-skills }
          podSelector:
            matchLabels: { app: mcp-fichiers }
        # oauth2-proxy de l'outil de visualisation
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-workflow }
          podSelector:
            matchLabels: { app: sophia-workflow-collecteur }
        # oauth2-proxy et API de l'interface de discussion
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-interface }
          podSelector:
            matchLabels: { app: sophia-interface }
        # oauth2-proxy de l'interface Temporal (jeton, clés) ; serveur Temporal (clés de signature),
        # Jobs d'administration (jeton du compte temporal-admin) et répartiteur (jeton du compte temporal-repartiteur)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-core }
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [temporal-ui, temporal, temporal-admin, repartiteur] }
        # backend de la bureautique (jeton, userinfo, clés) ; l'éditeur en ligne est exclu
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-workspace }
          podSelector:
            matchExpressions:
              - { key: app, operator: In, values: [fichiers-backend, fichiers-worker] }
        # oauth2-proxy des postes au navigateur (jeton, clés) ; le navigateur du poste passe par le routeur,
        # déjà admis ci-dessus
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-postes }
          podSelector:
            matchLabels: { sophia/poste: "true" }
        # service mémoire : clés du realm (JWKS), pour vérifier les jetons relayés par le chat
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-memory }
          podSelector:
            matchLabels: { app: sophia-memoire }
        # messagerie : oauth2-proxy (jeton, clés) et serveur XMPP (userinfo, par le nom complet du Service)
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-messagerie }
          podSelector:
            matchLabels: { sophia/messagerie: "true" }
      ports:
        - { protocol: TCP, port: 8080 }
    - from:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 9000 }
