# PIdent.2/3 — Flux réseau de l'identité.
---
# PostgreSQL accepte Keycloak (s'ajoute à allow-litellm-to-postgres, sans la modifier).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-identity-to-postgres
  namespace: sophia-core
spec:
  podSelector:
    matchLabels: { app: postgres-sophia }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-identity }
      ports:
        - { protocol: TCP, port: 5432 }
---
# Keycloak : entrée depuis le routeur (navigateurs), depuis sophia-apps (échanges
# serveur à serveur des proxys OIDC) et depuis le namespace lui-même (operator,
# cluster Infinispan). Sortie non restreinte à ce stade : l'operator parle à l'API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sophia-identity-ingress
  namespace: sophia-identity
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { policy-group.network.openshift.io/ingress: "" }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: sophia-apps }
        - podSelector: {}
