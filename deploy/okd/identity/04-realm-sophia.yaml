# PIdent.4 — Realm « sophia » : groupes, politique de mots de passe, premier client.
#
# Import unique : l'operator crée le realm s'il n'existe pas, il ne le met pas à jour
# ensuite. Les évolutions passent par la console d'administration, puis sont reportées ici.
#
# Les utilisateurs ne sont PAS dans ce fichier (données personnelles, mots de passe) :
# l'administrateur les crée dans la console et les place dans leur groupe.
#
# Le secret du client vient d'un Secret Kubernetes (placeholder), jamais du dépôt :
#   oc create secret generic keycloak-client-sophia-interface -n sophia-identity \
#     --from-literal=secret="$(openssl rand -hex 32)"
---
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: realm-sophia
  namespace: sophia-identity
spec:
  keycloakCRName: sophia-keycloak
  placeholders:
    SOPHIA_INTERFACE_CLIENT_SECRET:
      secret: { name: keycloak-client-sophia-interface, key: secret }
    # Installation neuve seulement (secret aussi copié dans temporal-ui-oauth2 de sophia-core)
    TEMPORAL_UI_CLIENT_SECRET:
      secret: { name: keycloak-client-temporal-ui, key: secret }
  realm:
    realm: sophia
    displayName: SophIA
    enabled: true
    registrationAllowed: false
    resetPasswordAllowed: false
    rememberMe: true
    # Sessions : 30 min d'inactivité sans « Se souvenir de moi » (défaut Keycloak) ;
    # avec, 30 jours d'inactivité et 90 jours au plus. L'accès passe par le VPN, et les
    # tablettes des enfants ne doivent pas redemander le mot de passe à chaque pause.
    ssoSessionIdleTimeoutRememberMe: 2592000    # 30 jours
    ssoSessionMaxLifespanRememberMe: 7776000    # 90 jours
    loginWithEmailAllowed: true
    bruteForceProtected: true
    passwordPolicy: "length(12) and notUsername"
    internationalizationEnabled: true
    supportedLocales: [fr, en]
    defaultLocale: fr
    # Rôles de l'objectif fonctionnel (F8). Les niveaux de confidentialité
    # s'appuieront sur ces groupes (P6).
    groups:
      - name: admin
      - name: responsables
      - name: proteges
      - name: invites
    # Pas de liste clientScopes : elle remplacerait les scopes par défaut de
    # Keycloak (profile, email, basic, roles…) au lieu de s'y ajouter.
    clients:
      - clientId: sophia-interface
        name: Interface SophIA
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${SOPHIA_INTERFACE_CLIENT_SECRET}
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
          - https://chat.example.org/oauth2/callback
        webOrigins:
          - https://chat.example.org
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://chat.example.org/
        # Les groupes de l'utilisateur dans le jeton (claim « groups »), sans scope dédié.
        protocolMappers:
          - name: groups
            protocol: openid-connect
            protocolMapper: oidc-group-membership-mapper
            config:
              claim.name: groups
              full.path: "false"
              id.token.claim: "true"
              access.token.claim: "true"
              userinfo.token.claim: "true"
      # Interface d'administration de RabbitMQ. Ajouté au realm existant par import
      # dans la console (identity/clients/rabbitmq.json) ; reporté ici pour une installation neuve.
      - clientId: rabbitmq
        name: RabbitMQ (administration)
        enabled: true
        protocol: openid-connect
        publicClient: true
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
        - https://rabbitmq.example.org/js/oidc-oauth/login-callback.html
        webOrigins:
        - https://rabbitmq.example.org
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://rabbitmq.example.org/
        protocolMappers:
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: 'false'
            id.token.claim: 'true'
            access.token.claim: 'true'
            userinfo.token.claim: 'true'
        - name: audience-rabbitmq
          protocol: openid-connect
          protocolMapper: oidc-audience-mapper
          config:
            included.client.audience: rabbitmq
            id.token.claim: 'false'
            access.token.claim: 'true'
      # Interface Temporal (oauth2-proxy). Ajouté au realm existant par import dans la
      # console (clients/temporal-ui.json, secret généré par Keycloak) ; reporté ici pour une installation neuve.
      - clientId: temporal-ui
        name: Temporal (administration)
        enabled: true
        protocol: openid-connect
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${TEMPORAL_UI_CLIENT_SECRET}
        standardFlowEnabled: true
        directAccessGrantsEnabled: false
        implicitFlowEnabled: false
        serviceAccountsEnabled: false
        redirectUris:
        - https://temporal.apps.example.org/oauth2/callback
        webOrigins:
        - https://temporal.apps.example.org
        attributes:
          pkce.code.challenge.method: S256
          post.logout.redirect.uris: https://temporal.apps.example.org/
        protocolMappers:
        - name: groups
          protocol: openid-connect
          protocolMapper: oidc-group-membership-mapper
          config:
            claim.name: groups
            full.path: 'false'
            id.token.claim: 'true'
            access.token.claim: 'true'
            userinfo.token.claim: 'true'
