# Garde-fous de sophia-inference (namespace existant, label zone=air-gapped).
# PriorityClass : le serveur d'inférence passe devant les autres consommateurs du GPU
# (runner GPU, sondes) et peut les évincer (risque R6).
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: sophia-inference-high
value: 1000000
preemptionPolicy: PreemptLowerPriority
globalDefault: false
description: "Serveur d'inférence locale SophIA : prioritaire sur le GPU"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: inference-quota
  namespace: sophia-inference
spec:
  # Texte 20 CPU / 40 Gi (Guaranteed), voix 4 / 4 Gi, modèles d'image 10 / 13 Gi, exporteur du nœud 0,1 / 64 Mi :
  # 34,1 CPU et 57,1 Gi. Tous en Recreate : aucun chevauchement au redéploiement ; la marge (5,9 CPU, 6,9 Gi) sert
  # à un pod ponctuel.
  hard:
    limits.memory: 64Gi
    limits.cpu: "40"
    pods: "6"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: inference-defaults
  namespace: sophia-inference
spec:
  limits:
    - type: Container
      default: { cpu: 500m, memory: 512Mi }
      defaultRequest: { cpu: 50m, memory: 64Mi }
