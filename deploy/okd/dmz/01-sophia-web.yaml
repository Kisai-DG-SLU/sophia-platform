# sophia-web : serveur MCP + REST de recherche web (sophia-dmz).
# L'image est construite dans sophia-apps et tirée par sophia-dmz : aucun identifiant
# Forgejo dans la zone exposée au web.
# Build binaire, depuis une copie locale du code du service (le dépôt d'origine contient
# des sous-modules SSH qu'un build Git d'OpenShift ne peut pas cloner) :
#   oc start-build sophia-web -n sophia-apps --from-dir=<code de sophia-web> --follow
# Prérequis (l'administrateur), une fois :
#   oc policy add-role-to-user system:image-puller system:serviceaccount:sophia-dmz:default -n sophia-apps
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: sophia-web
  namespace: sophia-apps
  labels: { app: sophia-web }
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: sophia-web
  namespace: sophia-apps
  labels: { app: sophia-web }
spec:
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy: { dockerfilePath: Containerfile }
  output:
    to: { kind: ImageStreamTag, name: "sophia-web:latest" }
  runPolicy: Serial
  successfulBuildsHistoryLimit: 3
  failedBuildsHistoryLimit: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sophia-web
  namespace: sophia-dmz
  labels: { app: sophia-web }
  annotations:
    image.openshift.io/triggers: '[{"from":{"kind":"ImageStreamTag","name":"sophia-web:latest","namespace":"sophia-apps"},"fieldPath":"spec.template.spec.containers[?(@.name==\"sophia-web\")].image"},{"from":{"kind":"ImageStreamTag","name":"sophia-web:latest","namespace":"sophia-apps"},"fieldPath":"spec.template.spec.containers[?(@.name==\"cook\")].image"}]'
spec:
  replicas: 1
  selector: { matchLabels: { app: sophia-web } }
  template:
    metadata:
      labels: { app: sophia-web }
    spec:
      priorityClassName: sophia-agents    # services de fond (../cluster/priority-classes.yaml)
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: sophia-web
          image: image-registry.openshift-image-registry.svc:5000/sophia-apps/sophia-web:latest
          ports: [{ name: http, containerPort: 8000 }]
          env:
            - { name: SEARXNG_URL, value: "http://searxng.sophia-dmz.svc.cluster.local:8080" }
            # Jeton partagé avec l'interface pour PUT /cache/communes (Secret de l'administrateur, même valeur
            # côté interface). Facultatif : sans lui, le cache de secours est désactivé, le reste ne change pas.
            - name: SOPHIA_WEB_CACHE_TOKEN
              valueFrom: { secretKeyRef: { name: sophia-web-cache, key: jeton, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 15
          resources:
            requests: { cpu: 20m, memory: 320Mi }
            limits: { cpu: "1", memory: 768Mi }
        # Téléchargement pour le module Cuisine (routes /telecharger et /liens), sur le port 8001, que seule la
        # NetworkPolicy sophia-web-cook-ingress (02-network.yaml) laisse entrer, depuis le module Cuisine.
        # Même image, autre application (cook:app) : le port 8000 n'a pas ces routes, aucun modèle ne les voit.
        - name: cook
          image: image-registry.openshift-image-registry.svc:5000/sophia-apps/sophia-web:latest
          command: [python3.12, -m, uvicorn, "cook:app", --host, 0.0.0.0, --port, "8001", --no-access-log]
          ports: [{ name: cook, containerPort: 8001 }]
          env:
            # Liste fermée des noms d'hôte exacts admis, séparés par des virgules (ConfigMap de l'administrateur) ;
            # absente ou vide : tout est refusé.
            - name: SOPHIA_WEB_TELECHARGEMENT_HOTES
              valueFrom: { configMapKeyRef: { name: sophia-web-cook, key: hotes, optional: true } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          readinessProbe:
            httpGet: { path: /health, port: cook }
            periodSeconds: 15
          # Un PDF de 10 Mo et son base64 tiennent largement ; Python et uvicorn seuls font environ 60 Mio.
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: sophia-web
  namespace: sophia-dmz
  labels: { app: sophia-web }
spec:
  selector: { app: sophia-web }
  ports:
    - { name: http, port: 8000, targetPort: http }
    - { name: cook, port: 8001, targetPort: cook }
