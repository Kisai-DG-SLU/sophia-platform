---
# ATHENA: Strategist and Critical Infrastructure
# Rights: cluster-admin (absolute)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: athena-sa
  namespace: ${AGENT_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: athena-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
- kind: ServiceAccount
  name: athena-sa
  namespace: ${AGENT_NAMESPACE}

---
# HEPHAISTOS: The Forger
# Rights: admin ONLY on ${SANDBOX_NAMESPACE}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hephaistos-sa
  namespace: ${AGENT_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hephaistos-sandbox-admin
  namespace: ${SANDBOX_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: hephaistos-sa
  namespace: ${AGENT_NAMESPACE}

---
# OURANOS: The Architect
# Rights: admin ONLY on ${APPS_NAMESPACE}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ouranos-sa
  namespace: ${AGENT_NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ouranos-apps-admin
  namespace: ${APPS_NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
subjects:
- kind: ServiceAccount
  name: ouranos-sa
  namespace: ${AGENT_NAMESPACE}
