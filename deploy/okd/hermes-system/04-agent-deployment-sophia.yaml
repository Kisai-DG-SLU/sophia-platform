apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sophia
  namespace: ${AGENT_NAMESPACE}
spec:
  serviceName: "sophia"
  replicas: 1
  selector:
    matchLabels:
      app: sophia
  template:
    metadata:
      labels:
        app: sophia
    spec:
      # Compte propre à Sophia, sans aucun droit sur le cluster (12-sophia-sa.yaml), SCC restricted-v2
      # par défaut. Pas de jeton d'API monté : le seul jeton du pod est le jeton projeté d'audience
      # « repartiteur », que l'API Kubernetes refuse. Sophia délègue par le répartiteur seulement.
      serviceAccountName: sophia-sa
      automountServiceAccountToken: false

      initContainers:
      - name: init-workspace
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${AGENT_IMAGE_NAME}@${AGENT_IMAGE_DIGEST}
        command:
        - /bin/bash
        - -c
        - |
          export HOME=/tmp
          cd /opt/data
          git config --global --add safe.directory /opt/data
          # Jeton lu par le credential helper, jamais écrit dans l'URL du remote (.git/config)
          git config --global credential.helper '!f() { echo "username=${FORGEJO_USER}"; echo "password=${FORGEJO_TOKEN}"; }; f'
          git init
          # set-url nettoie aussi un remote existant (volume conservé)
          REPO_URL=http://${FORGEJO_SERVICE}:3000/${ORG_NAME}/${BRAIN_REPO}.git
          git remote add origin $REPO_URL 2>/dev/null || git remote set-url origin $REPO_URL
          git config core.sparseCheckout true
          grep -qxF "config/agents/common/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/common/" >> .git/info/sparse-checkout
          grep -qxF "config/agents/sophia/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/sophia/" >> .git/info/sparse-checkout
          git pull --depth=1 origin main || echo "No initial config."
          if [ -d "config/agents/common" ]; then cp -r config/agents/common/* . 2>/dev/null || true ; fi
          if [ -d "config/agents/sophia" ]; then cp -r config/agents/sophia/* . 2>/dev/null || true ; fi
          rm -rf config/
          if [ -f "config.yaml" ]; then
            envsubst < config.yaml > config.yaml.tmp && mv config.yaml.tmp config.yaml
          fi
        env:
        - name: AGENT_MODEL
          value: ${MODEL_THINK:-sophia-think}
        - name: FORGEJO_USER
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-sophia
              key: username
        - name: FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-sophia
              key: password
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data

      containers:
      - name: sophia
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${AGENT_IMAGE_NAME}@${AGENT_IMAGE_DIGEST}
        imagePullPolicy: Always
        command: ["hermes", "gateway", "run"]
        tty: true
        stdin: true
        resources:
          requests:
            cpu: ${SOPHIA_CPU_REQUEST:-500m}
            memory: ${SOPHIA_MEMORY_REQUEST:-1Gi}
          limits:
            cpu: ${SOPHIA_CPU_LIMIT:-2}
            memory: ${SOPHIA_MEMORY_LIMIT:-4Gi}
        env:
        - name: AGENT_PERSONA
          value: "SOPHIA"
        - name: PATH
          value: "${AGENT_PATH:-/opt/hermes/.venv/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}"
        # api_server coupé : un agent n'est joint que par le répartiteur, et seulement s'il est
        # exécutant (clé propre, voir hephaistos). Aucune clé commune.
        - name: API_SERVER_ENABLED
          value: "false"
        - name: HERMES_DASHBOARD
          value: "1"
        # UID arbitraire (restricted-v2) : pas d'entrée passwd, HOME vers le volume inscriptible
        - name: HOME
          value: /opt/data
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
        # Outil MCP de demande au répartiteur : jeton du demandeur et autorité TLS du répartiteur
        - name: jeton-repartiteur
          mountPath: /var/run/secrets/repartiteur
          readOnly: true
        - name: repartiteur-ca
          mountPath: /etc/repartiteur-ca
          readOnly: true

      volumes:
      - name: agent-storage
        emptyDir: {}
      # Jeton projeté, audience « repartiteur », renouvelé par le kubelet
      - name: jeton-repartiteur
        projected:
          sources:
          - serviceAccountToken: { audience: repartiteur, expirationSeconds: 3600, path: token }
      - name: repartiteur-ca
        configMap: { name: temporal-service-ca }
