        command: ["hermes", "gateway", "run"]
        tty: true
        stdin: true
        env:
        - name: AGENT_PERSONA
          value: "OURANOS"
        # Écart connu, correction prévue : « prompt » n'est traité par aucun code, la validation n'est
        # donc pas imposée. À remplacer par « systematic » (comme athena) avant tout usage.
        - name: REQUIRE_HITL
          value: "prompt"
