# --- ATHENA ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-athena
  namespace: ${AGENT_NAMESPACE}
spec:
  serviceName: "athena"
  replicas: 1
  selector:
    matchLabels:
      app: athena
  template:
    metadata:
      labels:
        app: athena
    spec:
      serviceAccountName: athena-sa
      initContainers:
      - name: init-workspace
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${AGENT_IMAGE_NAME}:latest
        command:
        - /bin/bash
        - -c
        - |
          export HOME=/tmp
          cd /opt/data
          git config --global --add safe.directory /opt/data
          # Jeton lu par le credential helper, jamais écrit dans l'URL du remote (.git/config)
          git config --global credential.helper '!f() { echo "username=${FORGEJO_USER}"; echo "password=${FORGEJO_TOKEN}"; }; f'
          git init
          # set-url nettoie aussi un remote existant (volume conservé)
          REPO_URL=http://${FORGEJO_SERVICE}:3000/${ORG_NAME}/${BRAIN_REPO}.git
          git remote add origin $REPO_URL 2>/dev/null || git remote set-url origin $REPO_URL
          git config core.sparseCheckout true
          grep -qxF "config/agents/common/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/common/" >> .git/info/sparse-checkout
          grep -qxF "config/agents/athena/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/athena/" >> .git/info/sparse-checkout
          git pull --depth=1 origin main || true
          if [ -d "config/agents/common" ]; then cp -r config/agents/common/* . 2>/dev/null || true ; fi
          if [ -d "config/agents/athena" ]; then cp -r config/agents/athena/* . 2>/dev/null || true ; fi
          rm -rf config/
        env:
        - name: AGENT_MODEL
          value: ${MODEL_ROUTINE:-sophia-routine}
        - name: FORGEJO_USER
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-athena
              key: username
        - name: FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-athena
              key: password
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
      containers:
      - name: hermes
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${AGENT_IMAGE_NAME}:latest
        command:
        - /bin/bash
        - -c
        - |
          envsubst < /opt/data/config.yaml > /tmp/config-expanded.yaml
          mv /tmp/config-expanded.yaml /opt/data/config.yaml
          echo "Config envsubst done"
          exec hermes gateway run
        tty: true
        stdin: true
        env:
        - name: HOME
          value: /opt/hermes
        - name: AGENT_PERSONA
          value: "ATHENA"
        - name: AGENT_MODEL
          value: ${MODEL_ROUTINE:-sophia-routine}
        - name: REQUIRE_HITL
          value: "systematic"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: ${HITL_DB_SECRET}
              key: POSTGRES_URL
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${AGENT_SECRET}
              key: telegram_bot_token
        - name: TELEGRAM_HITL_CHAT_ID
          value: ${TELEGRAM_HITL_CHAT_ID}
        - name: PATH
          value: "${AGENT_PATH:-/opt/hermes/.venv/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}"
        - name: API_SERVER_ENABLED
          value: "true"
        - name: API_SERVER_HOST
          value: "0.0.0.0"
        - name: API_SERVER_KEY
          value: ${API_SERVER_KEY}
        - name: GATEWAY_ALLOW_ALL_USERS
          value: "true"
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
        - name: hitl-tools
          mountPath: /opt/hermes/tools/approval.py
          subPath: approval.py
        - name: hitl-tools
          mountPath: /opt/hermes/tools/approval_store.py
          subPath: approval_store.py
      volumes:
      - name: agent-storage
        emptyDir: {}
      - name: hitl-tools
        configMap:
          name: ${HITL_TOOLS_CONFIGMAP}
---
