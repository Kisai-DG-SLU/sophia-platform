          value: "${AGENT_PATH:-/opt/hermes/.venv/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}"
        # api_server coupé : un agent n'est joint que par le répartiteur, et seulement s'il est
