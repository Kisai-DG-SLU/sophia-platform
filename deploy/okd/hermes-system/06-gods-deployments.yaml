          grep -qxF "config/agents/ouranos/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/ouranos/" >> .git/info/sparse-checkout
          git pull --depth=1 origin main || true
          if [ -d "config/agents/common" ]; then cp -r config/agents/common/* . 2>/dev/null || true ; fi
          if [ -d "config/agents/ouranos" ]; then cp -r config/agents/ouranos/* . 2>/dev/null || true ; fi
          rm -rf config/
