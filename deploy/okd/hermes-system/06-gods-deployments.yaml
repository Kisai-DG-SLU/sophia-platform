# --- ATHENA ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-athena
  namespace: ${AGENT_NAMESPACE}
spec:
  serviceName: "athena"
  replicas: 1
  selector:
    matchLabels:
      app: athena
  template:
    metadata:
      labels:
        app: athena
    spec:
      serviceAccountName: athena-sa
      initContainers:
      - name: init-workspace
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${AGENT_IMAGE_NAME}@${AGENT_IMAGE_DIGEST}
        command:
        - /bin/bash
        - -c
        - |
          export HOME=/tmp
          cd /opt/data
          git config --global --add safe.directory /opt/data
          # Jeton lu par le credential helper, jamais écrit dans l'URL du remote (.git/config)
          git config --global credential.helper '!f() { echo "username=${FORGEJO_USER}"; echo "password=${FORGEJO_TOKEN}"; }; f'
          git init
          # set-url nettoie aussi un remote existant (volume conservé)
          REPO_URL=http://${FORGEJO_SERVICE}:3000/${ORG_NAME}/${BRAIN_REPO}.git
          git remote add origin $REPO_URL 2>/dev/null || git remote set-url origin $REPO_URL
          git config core.sparseCheckout true
          grep -qxF "config/agents/common/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/common/" >> .git/info/sparse-checkout
          grep -qxF "config/agents/athena/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/athena/" >> .git/info/sparse-checkout
          git pull --depth=1 origin main || true
          if [ -d "config/agents/common" ]; then cp -r config/agents/common/* . 2>/dev/null || true ; fi
          if [ -d "config/agents/athena" ]; then cp -r config/agents/athena/* . 2>/dev/null || true ; fi
          rm -rf config/
        env:
        - name: AGENT_MODEL
          value: ${MODEL_ROUTINE:-sophia-routine}
        - name: FORGEJO_USER
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-athena
              key: username
        - name: FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-athena
              key: password
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
      containers:
      - name: hermes
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${AGENT_IMAGE_NAME}@${AGENT_IMAGE_DIGEST}
        command:
        - /bin/bash
        - -c
        - |
          envsubst < /opt/data/config.yaml > /tmp/config-expanded.yaml
          mv /tmp/config-expanded.yaml /opt/data/config.yaml
          echo "Config envsubst done"
          exec hermes gateway run
        tty: true
        stdin: true
        env:
        - name: HOME
          value: /opt/hermes
        - name: AGENT_PERSONA
          value: "ATHENA"
        - name: AGENT_MODEL
          value: ${MODEL_ROUTINE:-sophia-routine}
        - name: REQUIRE_HITL
          value: "systematic"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: ${HITL_DB_SECRET}
              key: POSTGRES_URL
        - name: TELEGRAM_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${AGENT_SECRET}
              key: telegram_bot_token
        - name: TELEGRAM_HITL_CHAT_ID
          value: ${TELEGRAM_HITL_CHAT_ID}
        # Messagerie : seuls les identifiants listés parlent à l'agent ; sans liste, refus
        - name: TELEGRAM_ALLOWED_USERS
          value: ${TELEGRAM_ALLOWED_USERS}
        - name: PATH
          value: "${AGENT_PATH:-/opt/hermes/.venv/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin}"
        # api_server coupé : un agent n'est joint que par le répartiteur, et seulement s'il est
        # exécutant (clé propre, voir hephaistos). Aucune clé commune.
        - name: API_SERVER_ENABLED
          value: "false"
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
        - name: hitl-tools
          mountPath: /opt/hermes/tools/approval.py
          subPath: approval.py
        - name: hitl-tools
          mountPath: /opt/hermes/tools/approval_store.py
          subPath: approval_store.py
      volumes:
      - name: agent-storage
        emptyDir: {}
      - name: hitl-tools
        configMap:
          name: ${HITL_TOOLS_CONFIGMAP}
---
# --- HEPHAISTOS ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-hephaistos
  namespace: ${AGENT_NAMESPACE}
spec:
  serviceName: "hephaistos"
  replicas: 1
  selector:
    matchLabels:
      app: hephaistos
  template:
    metadata:
      labels:
        app: hephaistos
    spec:
      serviceAccountName: hephaistos-sa
      initContainers:
      - name: init-workspace
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${AGENT_IMAGE_NAME}@${AGENT_IMAGE_DIGEST}
        command:
        - /bin/bash
        - -c
        - |
          export HOME=/tmp
          cd /opt/data
          git config --global --add safe.directory /opt/data
          # Jeton lu par le credential helper, jamais écrit dans l'URL du remote (.git/config)
          git config --global credential.helper '!f() { echo "username=${FORGEJO_USER}"; echo "password=${FORGEJO_TOKEN}"; }; f'
          git init
          # set-url nettoie aussi un remote existant (volume conservé)
          REPO_URL=http://${FORGEJO_SERVICE}:3000/${ORG_NAME}/${BRAIN_REPO}.git
          git remote add origin $REPO_URL 2>/dev/null || git remote set-url origin $REPO_URL
          git config core.sparseCheckout true
          grep -qxF "config/agents/common/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/common/" >> .git/info/sparse-checkout
          grep -qxF "config/agents/hephaistos/" .git/info/sparse-checkout 2>/dev/null || echo "config/agents/hephaistos/" >> .git/info/sparse-checkout
          git pull --depth=1 origin main || true
          if [ -d "config/agents/common" ]; then cp -r config/agents/common/* . 2>/dev/null || true ; fi
          if [ -d "config/agents/hephaistos" ]; then cp -r config/agents/hephaistos/* . 2>/dev/null || true ; fi
          rm -rf config/
          if [ -f "config.yaml" ]; then
            envsubst < config.yaml > config.yaml.tmp && mv config.yaml.tmp config.yaml
          fi
        env:
        - name: AGENT_MODEL
          value: ${MODEL_ROUTINE:-sophia-routine}
        - name: FORGEJO_USER
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-hephaistos
              key: username
        - name: FORGEJO_TOKEN
          valueFrom:
            secretKeyRef:
              name: ${FORGEJO_SECRET_PREFIX}-hephaistos
              key: password
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
      # La configuration commune est écrite pour la version des autres agents ; la version de
      # l'exécutant ne la migre pas d'elle-même. Migration non interactive à chaque démarrage
      # (idempotente), puis les surcharges propres à l'agent, APRÈS la migration, qui sinon les
      # remplacerait par ses nouvelles valeurs par défaut.
      - name: config-migrate
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${EXECUTANT_IMAGE_NAME}@${EXECUTANT_IMAGE_DIGEST}
        imagePullPolicy: IfNotPresent
        workingDir: /opt/data
        command:
        - /bin/sh
        - -c
        - |
          set -e
          /opt/hermes/.venv/bin/python -P -c '
          import site, sys
          sys.path[:0] = ["/opt/hermes"]
          site.addsitedir("/opt/hermes/.venv/lib/python3.14/site-packages")
          from hermes_cli.config import migrate_config
          r = migrate_config(interactive=False, quiet=False)
          print("avertissements :", r["warnings"])
          '
          if [ -f surcharges.yaml ]; then
            yq -i '. *= load("surcharges.yaml")' config.yaml
          fi
        env:
        - { name: HERMES_HOME, value: /opt/data }
        - { name: HOME, value: /opt/data }
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
      containers:
      - name: hermes
        image: ${INTERNAL_REGISTRY}/${AGENT_NAMESPACE}/${EXECUTANT_IMAGE_NAME}@${EXECUTANT_IMAGE_DIGEST}
        imagePullPolicy: IfNotPresent
        command: ["hermes", "gateway", "run"]
        tty: true
        stdin: true
        env:
        - name: AGENT_PERSONA
          value: "HEPHAISTOS"
        - name: PATH
          value: "/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
        # Exécutant : api_server actif dès qu'une clé d'au moins 16 caractères est présente. Clé propre,
        # connue du seul répartiteur ; entrée limitée au répartiteur (09-executants-network.yaml).
        - name: API_SERVER_KEY
          valueFrom: { secretKeyRef: { name: repartiteur-cle-hephaistos, key: cle } }
        - { name: API_SERVER_HOST, value: 0.0.0.0 }
        - { name: API_SERVER_PORT, value: "8642" }
        - { name: HERMES_HOME, value: /opt/data }
        - { name: HOME, value: /opt/data }
        envFrom:
        - configMapRef:
            name: ${AGENT_CONFIG_MAP}
        - secretRef:
            name: ${AGENT_SECRET}
        ports:
        - { name: api, containerPort: 8642 }
        readinessProbe:
          httpGet: { path: /health, port: api }
          initialDelaySeconds: 20
          periodSeconds: 10
        volumeMounts:
        - name: agent-storage
          mountPath: /opt/data
      volumes:
      - name: agent-storage
        emptyDir: {}
---
